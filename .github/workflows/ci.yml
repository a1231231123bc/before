name: Check Before
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - run: npx expo export --platform all
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chromium-test-results
          path: test-results/

  safari-video:
    # WebKit uses platform media codecs. Test Safari playback on macOS.
    # https://playwright.dev/docs/browsers#webkit
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install webkit
      - run: npm run test:e2e -- --project=webkit
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: webkit-test-results
          path: test-results/
